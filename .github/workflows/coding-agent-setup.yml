name: coding-agent-setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent development environment
        run: python -m pip install -e ".[dev]"
      - name: Show agent reading order
        run: |
          sed -n '1,140p' AGENTS.md
          sed -n '1,180p' docs/README.md
      - name: Validate setup
        run: make check
